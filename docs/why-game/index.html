<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>十萬個為什麼 · 生活問答</title>
<meta name="description" content="全家一起玩的生活問答：四選一，答完看有趣的解釋。">
<meta name="theme-color" content="#E8572A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10211E" media="(prefers-color-scheme: dark)">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #F1F7F4; --surface: #FFFFFF; --ink: #16302B; --muted: #4E6A63; --line: #CFE0DA;
    --accent: #E8572A; --on-accent: #FFFFFF; --butter: #FFD45C; --on-butter: #16302B;
    --good: #1E7F52; --good-bg: #DDF3E8; --bad: #B5342B; --bad-bg: #FBE3E0;
    --chip-on: #16302B; --on-chip: #FFFFFF;
    --font: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10211E; --surface: #19302B; --ink: #EAF5F1; --muted: #9CBBB2; --line: #2D4A43;
      --accent: #FF8A5C; --on-accent: #10211E; --good: #6FDCA4; --good-bg: #1B4636;
      --bad: #FF9A90; --bad-bg: #4A2623; --chip-on: #FFD45C; --on-chip: #10211E;
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.6; -webkit-text-size-adjust: 100%; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { margin: 0; font-size: 28px; letter-spacing: .02em; }
  .sub { margin: 4px 0 18px; color: var(--muted); font-size: 15px; }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .panel { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 14px; }
  .row > b { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: transparent; cursor: pointer; border: 2px solid var(--line); border-radius: 999px;
    padding: 4px 14px; min-height: 44px; font-size: 15px;
  }
  .chip[aria-pressed="true"] { background: var(--chip-on); color: var(--on-chip); border-color: var(--chip-on); font-weight: 700; }
  .left { color: var(--muted); font-size: 14px; margin: 2px 0 0; }
  .go {
    width: 100%; min-height: 58px; margin-top: 18px; cursor: pointer; font-size: 20px; font-weight: 700;
    background: var(--accent); color: var(--on-accent); border: 2px solid var(--ink); border-radius: 16px; box-shadow: 0 4px 0 var(--ink);
  }
  .go:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .notice { margin: 12px 0 0; padding: 8px 12px; border-radius: 12px; background: var(--butter); color: var(--on-butter); font-size: 14px; font-weight: 600; }

  .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; }
  .quit { background: none; border: 2px solid var(--line); border-radius: 10px; padding: 4px 12px; min-height: 40px; cursor: pointer; color: var(--muted); font-size: 14px; font-weight: 500; }
  .bar { height: 8px; border-radius: 999px; background: var(--line); margin: 10px 0 16px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .card { background: var(--surface); border: 2px solid var(--ink); border-radius: 18px 18px 26px 26px; box-shadow: 0 6px 0 var(--ink); overflow: hidden; }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 16px 0; }
  .pill { border: 2px solid var(--ink); border-radius: 999px; padding: 1px 12px; font-size: 13px; font-weight: 700; background: var(--surface); }
  .pill.lv { background: var(--butter); color: var(--on-butter); }
  .q { margin: 0; padding: 14px 18px 18px; font-size: clamp(22px, 5.6vw, 28px); font-weight: 700; line-height: 1.45; overflow-wrap: anywhere; }
  .opts { display: grid; gap: 10px; margin: 18px 0 0; }
  .opt {
    display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%; min-height: 56px; padding: 10px 14px; cursor: pointer;
    background: var(--surface); border: 2px solid var(--line); border-radius: 14px; font-size: 17px; line-height: 1.45;
  }
  .opt .k { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2px solid currentColor; font-size: 13px; font-weight: 700; display: grid; place-items: center; margin-top: 1px; }
  .opt .m { margin-left: auto; font-weight: 700; flex: none; }
  .opt:hover:not(:disabled) { border-color: var(--ink); }
  .opt:disabled { cursor: default; }
  .opt.good { background: var(--good-bg); border-color: var(--good); color: var(--good); font-weight: 700; }
  .opt.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
  .opt.dim { opacity: .55; }
  .why { margin: 16px 0 0; padding: 14px; border-radius: 14px; background: var(--surface); border: 2px dashed var(--line); }
  .why b { display: block; font-size: 16px; margin-bottom: 4px; }
  .why p { margin: 0; font-size: 16px; }
  .next { margin-top: 14px; }

  .score { font-size: 56px; font-weight: 800; text-align: center; margin: 14px 0 0; line-height: 1.1; }
  .score small { font-size: 24px; color: var(--muted); font-weight: 600; }
  .msg { text-align: center; font-size: 18px; margin: 8px 0 0; }
  .two { display: grid; gap: 10px; margin-top: 14px; }
  .alt { width: 100%; min-height: 50px; cursor: pointer; background: transparent; border: 2px solid var(--line); border-radius: 14px; font-size: 16px; }
  .foot { margin-top: 28px; color: var(--muted); font-size: 12px; text-align: center; }
  .foot button { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 12px; padding: 8px; min-height: 36px; }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } .go:active { transform: none; } }
</style>
<!--hub-pwa--><link rel="manifest" href="../manifest.json"><link rel="apple-touch-icon" href="../icons/apple-touch-icon.png"><style>#hub-home{display:block;width:max-content;margin:0 0 12px;padding:6px 12px;border-radius:999px;background:#2b2420;color:#fff;font:600 14px/1.4 system-ui,"PingFang TC","Microsoft JhengHei",sans-serif;text-decoration:none}#hub-home:focus-visible{outline:3px solid #c0392b;outline-offset:2px}</style><style>#hub-home{margin:12px 0 0 max(16px,calc(50% - 304px))}</style></head>
<body><a id="hub-home" href="../" aria-label="回到首頁">← 首頁</a>
<main class="wrap">
  <!-- 選單 -->
  <section id="home">
    <h1>十萬個為什麼</h1>
    <p class="sub">生活裡的小疑問，四選一，答完看有趣的解釋。</p>
    <div class="panel">
      <div class="row"><b>誰來玩？</b><div class="chips" id="levels"></div></div>
      <div class="row"><b>想玩哪一類？</b><div class="chips" id="cats"></div></div>
      <p class="left" id="left"></p>
    </div>
    <button class="go" id="start">開始，10 題</button>
  </section>

  <!-- 作答 -->
  <section id="quiz" class="hidden">
    <p class="notice hidden" id="notice" style="margin:0 0 12px"></p>
    <div class="head"><span id="prog"></span><button class="quit" id="quit">結束本局</button></div>
    <div class="bar" aria-hidden="true"><i id="barfill"></i></div>
    <div class="card">
      <div class="tags"><span class="pill" id="tcat"></span><span class="pill lv" id="tlv"></span></div>
      <h2 class="q" id="q"></h2>
    </div>
    <div class="opts" id="opts"></div>
    <div id="after" class="hidden" aria-live="polite">
      <div class="why"><b id="verdict"></b><p id="why"></p></div>
      <button class="go next" id="next">下一題</button>
    </div>
  </section>

  <!-- 結果 -->
  <section id="result" class="hidden">
    <h1>這一局結束了</h1>
    <p class="score"><span id="sc"></span><small> / 10</small></p>
    <p class="msg" id="msg"></p>
    <div class="two">
      <button class="go" id="again" style="margin-top:6px">再玩一局</button>
      <button class="alt" id="menu">換個設定</button>
    </div>
  </section>

  <p class="foot">題目由 AI 協助產生，未逐題校對；覺得奇怪的答案，歡迎全家一起查一查。<br>
    <button id="reset">清除「玩過的題」紀錄</button></p>
</main>
<script src="questions.js"></script>
<script>
(() => {
  const D = window.WG_DATA;
  const $ = s => document.querySelector(s);
  const ROUND = 10;
  const LEVELS = [['all', '全家一起'], ['k', '孩子題'], ['a', '大人題']];
  const LV_LABEL = { k: '孩子題', a: '大人題' };
  const SEEN_KEY = 'whygame-seen', PREF_KEY = 'whygame-prefs';

  // localStorage 可能被禁用（無痕、隱私設定），失敗時照常能玩，只是不記錄
  const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

  const validIds = new Set(D.cards.map(c => c.id));
  let seen = new Set((Array.isArray(load(SEEN_KEY, [])) ? load(SEEN_KEY, []) : []).filter(id => validIds.has(id)));
  let prefs = Object.assign({ level: 'all', cat: 'all' }, load(PREF_KEY, {}));
  if (!LEVELS.some(l => l[0] === prefs.level)) prefs.level = 'all';
  if (prefs.cat !== 'all' && !D.cats[prefs.cat]) prefs.cat = 'all';

  let S = null; // 本局狀態：{ qs, i, score, answered }

  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pool = () => D.cards.filter(c => (prefs.level === 'all' || c.level === prefs.level) && (prefs.cat === 'all' || c.cat === prefs.cat));
  const show = id => ['home', 'quiz', 'result'].forEach(s => $('#' + s).classList.toggle('hidden', s !== id));

  function chip(label, on, fn) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = label; b.setAttribute('aria-pressed', on);
    b.addEventListener('click', fn); return b;
  }
  function renderHome() {
    const lv = $('#levels'), ct = $('#cats'); lv.textContent = ''; ct.textContent = '';
    LEVELS.forEach(([v, t]) => lv.append(chip(t, prefs.level === v, () => { prefs.level = v; save(PREF_KEY, prefs); renderHome(); })));
    ct.append(chip('全部', prefs.cat === 'all', () => { prefs.cat = 'all'; save(PREF_KEY, prefs); renderHome(); }));
    Object.entries(D.cats).forEach(([v, t]) => ct.append(chip(t, prefs.cat === v, () => { prefs.cat = v; save(PREF_KEY, prefs); renderHome(); })));
    const p = pool(), un = p.filter(c => !seen.has(c.id)).length;
    $('#left').textContent = `這個組合共 ${p.length} 題，還有 ${un} 題沒玩過`;
  }

  function startRound() {
    const p = pool();
    if (!p.length) return;
    const unseen = p.filter(c => !seen.has(c.id));
    let pick, note = '';
    if (unseen.length >= ROUND) pick = shuffle(unseen).slice(0, ROUND);
    else {
      // 沒玩過的題不夠一局：先全部拿來用，再從玩過的補；並重新洗牌（清掉這個組合的玩過紀錄）
      const rest = shuffle(p.filter(c => seen.has(c.id)));
      pick = shuffle(unseen.concat(rest).slice(0, Math.min(ROUND, p.length)));
      if (rest.length) {
        const keep = new Set(unseen.map(c => c.id));
        p.forEach(c => { if (!keep.has(c.id)) seen.delete(c.id); });
        save(SEEN_KEY, [...seen]);
        note = '這個組合的題目都玩過一輪了，已經重新洗牌！';
      }
    }
    S = { qs: pick, i: 0, score: 0, answered: false, note };
    show('quiz'); showQuestion();
  }

  function showQuestion() {
    const c = S.qs[S.i]; S.answered = false;
    $('#prog').textContent = `第 ${S.i + 1} / ${S.qs.length} 題　答對 ${S.score} 題`;
    $('#barfill').style.width = (S.i / S.qs.length * 100) + '%';
    $('#notice').textContent = S.note; $('#notice').classList.toggle('hidden', !(S.note && S.i === 0));
    $('#tcat').textContent = D.cats[c.cat]; $('#tlv').textContent = LV_LABEL[c.level];
    $('#q').textContent = c.q;
    const box = $('#opts'); box.textContent = '';
    S.opts = shuffle(c.opts.map((t, i) => ({ t, ok: i === 0 })));
    S.opts.forEach((o, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'opt';
      b.innerHTML = '<span class="k"></span><span class="t"></span><span class="m"></span>';
      b.querySelector('.k').textContent = 'ABCD'[i]; b.querySelector('.t').textContent = o.t;
      b.addEventListener('click', () => choose(i));
      box.append(b);
    });
    $('#after').classList.add('hidden');
    $('#next').textContent = S.i === S.qs.length - 1 ? '看結果' : '下一題';
    window.scrollTo(0, 0);
  }

  function choose(i) {
    if (S.answered) return; S.answered = true;
    const c = S.qs[S.i], ok = S.opts[i].ok;
    if (ok) S.score++;
    seen.add(c.id); save(SEEN_KEY, [...seen]);
    [...$('#opts').children].forEach((b, k) => {
      b.disabled = true;
      const m = b.querySelector('.m');
      if (S.opts[k].ok) { b.classList.add('good'); m.textContent = '✓ 正確'; }
      else if (k === i) { b.classList.add('bad'); m.textContent = '✗ 你選的'; }
      else b.classList.add('dim');
    });
    const right = 'ABCD'[S.opts.findIndex(o => o.ok)];
    $('#verdict').textContent = ok ? '答對了！' : `差一點！正確答案是 ${right}`;
    $('#why').textContent = c.why;
    $('#prog').textContent = `第 ${S.i + 1} / ${S.qs.length} 題　答對 ${S.score} 題`;
    $('#barfill').style.width = ((S.i + 1) / S.qs.length * 100) + '%';
    $('#after').classList.remove('hidden');
    $('#next').focus({ preventScroll: true });
    $('#next').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function next() {
    if (!S || !S.answered) return;
    if (S.i < S.qs.length - 1) { S.i++; showQuestion(); return; }
    const n = S.score, t = S.qs.length;
    $('#sc').textContent = n;
    $('#msg').textContent = n === t ? '全對！你是「為什麼」博士！' : n >= t * 0.7 ? '好厲害，生活小百科就是你！' : n >= t * 0.4 ? '不錯喔，知道不少生活小祕密。' : '沒關係，答案才是最好玩的部分，再來一局！';
    show('result'); window.scrollTo(0, 0);
  }

  $('#start').addEventListener('click', startRound);
  $('#next').addEventListener('click', next);
  $('#again').addEventListener('click', startRound);
  $('#menu').addEventListener('click', () => { renderHome(); show('home'); });
  $('#quit').addEventListener('click', () => { if (confirm('要結束這一局，回到選單嗎？')) { renderHome(); show('home'); } });
  $('#reset').addEventListener('click', () => {
    if (confirm('清除後，玩過的題會重新出現。要清除嗎？')) { seen = new Set(); save(SEEN_KEY, []); renderHome(); }
  });
  document.addEventListener('keydown', e => {
    if ($('#quiz').classList.contains('hidden') || e.ctrlKey || e.metaKey || e.altKey) return;
    if (!S.answered && /^[1-4]$/.test(e.key)) choose(+e.key - 1);
    else if (S.answered && e.key === 'Enter' && document.activeElement !== $('#next')) next();
  });

  renderHome(); show('home');
  if (!pool().length) $('#start').disabled = true;
})();
</script>
<script>if("serviceWorker"in navigator)addEventListener("load",function(){navigator.serviceWorker.register("../sw.js",{scope:"../",updateViaCache:"none"}).catch(function(){})})</script></body>
</html>
